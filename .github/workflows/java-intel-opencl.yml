name: build java intel opencl
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - java/27-intel-opencl/**
      - java/entrypoint.sh
      - .github/workflows/java-intel-opencl.yml

jobs:
  push:
    name: "yolks:java_27-intel-opencl"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}:java_27-intel-opencl" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./java
          file: ./java/27-intel-opencl/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}
      - name: Verify Java and OpenCL installation without a GPU
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/java/27-intel-opencl/verify.sh:/verify.sh:ro" \
            "$IMAGE_NAME" /verify.sh
          docker run --rm --user 1000:1000 -e STARTUP='clinfo --version' "$IMAGE_NAME"
      - name: Publish image
        run: docker push "$IMAGE_NAME"
